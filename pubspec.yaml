name: chetegram
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

# --- Dependencies Section ---
dependencies:
  flutter:
    sdk: flutter

  # Utility Packages
  cupertino_icons: ^1.0.6
  lucide_flutter: ^1.408.0     # For Icons

  # Routing
  go_router: ^14.2.0           # For App Navigation

  # State Management
  flutter_riverpod: ^2.5.1     # For managing app state

  # Fonts
  google_fonts: ^6.2.1         # For using Google Fonts easily

  # Local Database
  sqflite: ^2.3.3+1         # For local SQL database
  path_provider: ^2.1.3    # For finding local paths
  path: ^1.9.0             # For path manipulation


# --- Developer Dependencies Section ---
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# --- Flutter Specific Section ---
flutter:
  uses-material-design: true

