name: chetegram
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Utility Packages
  cupertino_icons: ^1.0.6
  lucide_flutter: ^0.545.0

  # Routing
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Fonts
  google_fonts: ^6.2.1

  # Local Database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI Packages
  flip_card: ^0.7.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  flutter_heatmap_calendar: ^1.0.5 # हीट-मैप के लिए

  # Firebase
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.1.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
