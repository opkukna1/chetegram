pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withReader("UTF-8") { reader ->
            properties.load(reader)
        }
        def flutterSdk = properties.getProperty("flutter.sdk")
        assert flutterSdk != null, "flutter.sdk not set in local.properties"
        return flutterSdk
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

include ':app'

apply from: new File(
  settings.pluginManager.resolutionStrategy.resolve(
    "dev.flutter.flutter-gradle-plugin:flutter_plugin_loader:1.0.0"
  ).getArtifact().getFile(),
  ["project": this]
)
